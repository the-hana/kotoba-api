openapi: "3.0.3"
info:
  title: kotoba-api
  version: "1.0.0"

servers:
  - url: http://localhost:3000
    description: 開発環境

paths:
  /api/v1/auth/signup:
    post:
      summary: ユーザー登録
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nickname, password, password_confirmation, target_level]
              properties:
                email:
                  type: string
                  format: email
                nickname:
                  type: string
                  maxLength: 30
                password:
                  type: string
                password_confirmation:
                  type: string
                target_level:
                  type: string
                  enum: [n5, n4, n3, n2, n1]
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: ログイン
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      summary: アクセストークン更新
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: トークン更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: refresh_token無効または期限切れ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    delete:
      summary: ログアウト
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    nullable: true
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/profile:
    get:
      summary: プロフィール取得
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: プロフィール取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Profile"
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: プロフィール更新
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  maxLength: 30
                target_level:
                  type: string
                  enum: [n5, n4, n3, n2, n1]
      responses:
        "200":
          description: プロフィール更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Profile"
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 退会（アカウント削除）
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退会成功（関連データも削除）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNullResponse"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/word_days:
    get:
      summary: DAY一覧取得
      tags: [WordDays]
      security:
        - bearerAuth: []
      parameters:
        - name: jlpt_level
          in: query
          required: true
          schema:
            type: string
            enum: [n5, n4, n3, n2, n1]
      responses:
        "200":
          description: DAY一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WordDay"
                  error:
                    nullable: true
        "400":
          description: jlpt_level未指定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/words:
    get:
      summary: 単語一覧取得
      tags: [Words]
      security:
        - bearerAuth: []
      parameters:
        - name: jlpt_level
          in: query
          required: true
          schema:
            type: string
            enum: [n5, n4, n3, n2, n1]
        - name: day_number
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: 単語一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Word"
                  error:
                    nullable: true
        "400":
          description: jlpt_level未指定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/study_session:
    get:
      summary: 学習セッション取得
      tags: [StudySession]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "セッション取得成功（セッション未作成の場合はdata: null）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/StudySession"
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: 学習セッション更新（upsert）
      tags: [StudySession]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word_day_id]
              properties:
                word_day_id:
                  type: integer
      responses:
        "200":
          description: セッション更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/StudySession"
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: WordDayが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/bookmarks:
    get:
      summary: ブックマーク済み単語一覧取得
      tags: [Bookmarks]
      security:
        - bearerAuth: []
      parameters:
        - name: jlpt_level
          in: query
          required: false
          schema:
            type: string
            enum: [n5, n4, n3, n2, n1]
      responses:
        "200":
          description: ブックマーク済み単語一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Word"
                  error:
                    nullable: true
        "400":
          description: jlpt_levelが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/words/{word_id}/bookmark:
    post:
      summary: 単語をブックマークに追加
      tags: [Bookmarks]
      security:
        - bearerAuth: []
      parameters:
        - name: word_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: ブックマーク追加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNullResponse"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 単語が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: すでにブックマーク済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 単語のブックマークを解除
      tags: [Bookmarks]
      security:
        - bearerAuth: []
      parameters:
        - name: word_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ブックマーク解除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNullResponse"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ブックマークが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/daily_story:
    get:
      summary: 最新のAIストーリー取得
      tags: [DailyStories]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "最新ストーリー（ストーリー未生成の場合はdata: null）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/DailyStory"
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/words/{id}:
    get:
      summary: 単語詳細取得（AI例文付き）
      tags: [Words]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 単語詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WordDetail"
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 単語が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/daily_story:
    post:
      summary: 日次ストーリー生成 (Lambda → Rails webhook)
      tags: [Webhooks]
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookDailyStoryRequest"
      responses:
        "201":
          description: ストーリー新規作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDailyStoryResponse"
        "200":
          description: "冪等: 同日付のストーリーが既に存在する"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDailyStoryResponse"
        "401":
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token

  schemas:
    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
        error:
          type: "null"

    Word:
      type: object
      properties:
        id:
          type: integer
        japanese:
          type: string
        hiragana:
          type: string
        korean:
          type: string
        jlpt_level:
          type: string
          enum: [n5, n4, n3, n2, n1]
        bookmarked:
          type: boolean

    WordDetail:
      allOf:
        - $ref: "#/components/schemas/Word"
        - type: object
          properties:
            ai_content:
              nullable: true
              type: object
              properties:
                example_sentence:
                  type: string
                example_sentence_korean:
                  type: string

    SuccessNullResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        error:
          nullable: true

    StudySession:
      type: object
      properties:
        word_day_id:
          type: integer
        jlpt_level:
          type: string
          enum: [n5, n4, n3, n2, n1]
        day_number:
          type: integer
        streak_days:
          type: integer
        updated_at:
          type: string
          format: date-time

    WordDay:
      type: object
      properties:
        id:
          type: integer
        day_number:
          type: integer

    Profile:
      type: object
      required: [id, email, nickname, target_level, created_at]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        nickname:
          type: string
        target_level:
          type: string
          enum: [n5, n4, n3, n2, n1]
        created_at:
          type: string
          format: date-time

    DailyStory:
      type: object
      properties:
        story_date:
          type: string
          format: date
        content:
          type: string
        content_korean:
          type: string
        words:
          type: array
          items:
            $ref: "#/components/schemas/DailyStoryWord"

    DailyStoryWord:
      type: object
      properties:
        id:
          type: integer
        japanese:
          type: string
        hiragana:
          type: string
        korean:
          type: string
        jlpt_level:
          type: string
          enum: [n5, n4, n3, n2, n1]
        example_sentence:
          type: string
          nullable: true
        example_sentence_korean:
          type: string
          nullable: true

    WebhookDailyStoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            story_date:
              type: string
              format: date
        error:
          nullable: true

    WebhookDailyStoryRequest:
      type: object
      required: [story_date, content, content_korean, words]
      properties:
        story_date:
          type: string
          format: date
        content:
          type: string
        content_korean:
          type: string
        words:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: object
            required: [word_id, example_sentence, example_sentence_korean]
            properties:
              word_id:
                type: integer
              example_sentence:
                type: string
              example_sentence_korean:
                type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        error:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
