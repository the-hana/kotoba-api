openapi: "3.0.3"
info:
  title: kotoba-api
  version: "1.0.0"

servers:
  - url: http://localhost:3000
    description: 開発環境

paths:
  /api/v1/auth/signup:
    post:
      summary: ユーザー登録
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nickname, password, password_confirmation, target_level]
              properties:
                email:
                  type: string
                  format: email
                nickname:
                  type: string
                  maxLength: 30
                password:
                  type: string
                password_confirmation:
                  type: string
                target_level:
                  type: string
                  enum: [n5, n4, n3, n2, n1]
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: ログイン
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      summary: アクセストークン更新
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: トークン更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: refresh_token無効または期限切れ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    delete:
      summary: ログアウト
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    nullable: true
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/words:
    get:
      summary: 単語一覧取得
      tags: [Words]
      security:
        - bearerAuth: []
      parameters:
        - name: jlpt_level
          in: query
          required: true
          schema:
            type: string
            enum: [n5, n4, n3, n2, n1]
        - name: day_number
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: 単語一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Word"
                  error:
                    nullable: true
        "400":
          description: jlpt_level未指定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/words/{id}:
    get:
      summary: 単語詳細取得（AI例文付き）
      tags: [Words]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 単語詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WordDetail"
                  error:
                    nullable: true
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 単語が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
        error:
          type: "null"

    Word:
      type: object
      properties:
        id:
          type: integer
        japanese:
          type: string
        hiragana:
          type: string
        korean:
          type: string
        jlpt_level:
          type: string
          enum: [n5, n4, n3, n2, n1]
        bookmarked:
          type: boolean

    WordDetail:
      allOf:
        - $ref: "#/components/schemas/Word"
        - type: object
          properties:
            ai_content:
              nullable: true
              type: object
              properties:
                example_sentence:
                  type: string
                example_sentence_korean:
                  type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        error:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
